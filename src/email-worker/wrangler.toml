name = "phneakngar-email-worker"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
invocation_logs = true
head_sampling_rate = 0.1

[observability.traces]
enabled = true
head_sampling_rate = 0.05

[dev]
port = 8787
inspector_port = 9231

[[d1_databases]]
binding = "DB"
database_id = "45d8f476-3631-47fb-abd1-49659a6234fe"
database_name = "phneakngar-app"

[[r2_buckets]]
binding = "EMAIL_BUCKET"
bucket_name = "phneakngar-emails"

[[send_email]]
name = "SEND_EMAIL"

# Current live-testing domain only; not a permanent product default.
# Must be onboarded to CF Email Sending and match the web Worker.
[vars]
NODE_ENV = "production"
PHNEAKNGAR_DOMAIN = "cieee.xyz"
# Require a passing DKIM/SPF/DMARC result aligned with the From domain before a whitelist
# match is trusted enough to auto-dispatch an agent task. Set to "false" only if the
# upstream MTA strips Authentication-Results.
EMAIL_REQUIRE_SENDER_AUTH = "true"

[[durable_objects.bindings]]
name = "IMAP_POLLER"
class_name = "ImapPollerDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ImapPollerDO"]
