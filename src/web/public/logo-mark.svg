<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Phneakngar">
  <!--
    Phneakngar Brand Mark — Eastern Minimalism
    Abstract agent figure with subtle "always-on" signal
    Warm charcoal tile with cream figure
  -->
  <!-- Soft tile base -->
  <rect x="2" y="2" width="28" height="28" rx="7" fill="currentColor"/>

  <!-- Agent head -->
  <circle cx="16" cy="12.5" r="3.2" fill="#faf9f7"/>

  <!-- Agent torso (rounded U) -->
  <path
    d="M9.5 22.5c.8-3.2 3.3-4.9 6.5-4.9s5.7 1.7 6.5 4.9"
    stroke="#faf9f7"
    stroke-width="2.8"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Subtle signal dot (always-on indicator) -->
  <circle cx="23.5" cy="9.5" r="1.4" fill="#c4a35a"/>

  <!-- Signal ring (faint) -->
  <circle cx="23.5" cy="9.5" r="2.8" stroke="#c4a35a" stroke-width="0.8" fill="none" opacity="0.4"/>
</svg>
