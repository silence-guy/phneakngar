<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="ភ្នាក់ងារ">
  <!--
    New brand mark (2026-07): "Always-on colleague"
    Soft app tile + abstract agent figure + live signal arc.
    Distinct from the older stacked-envelope mark.
    currentColor for light mode (inherits text/icon color).
  -->
  <!-- Soft app tile -->
  <rect x="2" y="2" width="28" height="28" rx="8" fill="currentColor"/>

  <!-- Agent head -->
  <circle cx="16" cy="12.25" r="3.6" fill="#FAF9F7"/>

  <!-- Agent shoulders / torso (rounded U) -->
  <path
    d="M9.2 22.8c.9-3.6 3.7-5.5 6.8-5.5s5.9 1.9 6.8 5.5"
    stroke="#FAF9F7"
    stroke-width="3.1"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Always-on signal arcs (upper right) -->
  <path
    d="M21.6 8.2c1.1 1.05 1.75 2.45 1.75 4"
    stroke="#FAF9F7"
    stroke-width="1.7"
    stroke-linecap="round"
    fill="none"
    opacity="0.95"
  />
  <path
    d="M24 6.4c1.7 1.65 2.7 3.85 2.7 6.25"
    stroke="#FAF9F7"
    stroke-width="1.7"
    stroke-linecap="round"
    fill="none"
    opacity="0.55"
  />

  <!-- Live status core -->
  <circle cx="23.1" cy="10.1" r="1.55" fill="#FAF9F7"/>
</svg>
