<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Phneakngar">
  <!--
    Phneakngar Brand Mark — Dark Variant
    Abstract agent figure with subtle "always-on" signal
    Dark warm tile with cream figure and gold accent
  -->
  <!-- Dark tile base -->
  <rect x="2" y="2" width="28" height="28" rx="7" fill="#0f0f0e"/>

  <!-- Agent head -->
  <circle cx="16" cy="12.5" r="3.2" fill="#f5f4f2"/>

  <!-- Agent torso (rounded U) -->
  <path
    d="M9.5 22.5c.8-3.2 3.3-4.9 6.5-4.9s5.7 1.7 6.5 4.9"
    stroke="#f5f4f2"
    stroke-width="2.8"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Subtle signal dot (always-on indicator) -->
  <circle cx="23.5" cy="9.5" r="1.4" fill="#d4b96a"/>

  <!-- Signal ring (faint) -->
  <circle cx="23.5" cy="9.5" r="2.8" stroke="#d4b96a" stroke-width="0.8" fill="none" opacity="0.5"/>
</svg>
