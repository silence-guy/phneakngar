name = "phneakngar-web"
main = "custom-worker.ts"
compatibility_date = "2026-04-09"
compatibility_flags = ["nodejs_compat"]
account_id = "2d5298c70ba99a7bec4e919c21b5d8ce"
# Disable esbuild keep_names — otherwise __name(...) wrappers leak into
# stringified inline scripts (ThemeScript, next-themes) and throw
# "__name is not defined" at runtime in the browser.
keep_names = false

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
invocation_logs = true
head_sampling_rate = 0.1
# destinations require account-level Grafana Cloud sinks; omit for first-party deploy

[observability.traces]
enabled = true
head_sampling_rate = 0.05

# OpenNext required bindings
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "phneakngar-web"

# OpenNext internal cache
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "phneakngar-next-cache"

[[d1_databases]]
binding = "NEXT_TAG_CACHE_D1"
database_id = "834d4752-2d52-4f64-8064-71649ab7e056"
database_name = "phneakngar-next-tags"

[[durable_objects.bindings]]
name = "NEXT_CACHE_DO_QUEUE"
class_name = "DOQueueHandler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DOQueueHandler"]

# App bindings
[[d1_databases]]
binding = "DB"
database_id = "45d8f476-3631-47fb-abd1-49659a6234fe"
database_name = "phneakngar-app"

[[r2_buckets]]
binding = "EMAIL_BUCKET"
bucket_name = "phneakngar-emails"

# WS Durable Object is in a separate worker — access via Service Binding
[[services]]
binding = "WS_DO_WORKER"
service = "phneakngar-ws-do"

[[services]]
binding = "EMAIL_WORKER"
service = "phneakngar-email-worker"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "585b65bc311a4e489692a42641e1319c"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "4bff39b5ff614c03812abeaf93308fd2"

[vars]
NODE_ENV = "production"
RUNTIME_MODEL_OPTIONS = '{"claude":["claude-opus-4-6","claude-sonnet-4-6","claude-haiku-4-5"],"codex":["gpt-5.4","gpt-5.3-codex"],"grok":["grok-4.5","grok-composer-2.5-fast"]}'
MIN_CLI_VERSION = "0.0.5"
# Current live-testing domain only; not a permanent product default.
# Must match Email Worker and Cloudflare Email Sending domain.
PHNEAKNGAR_DOMAIN = "cieee.xyz"
NEXT_PUBLIC_PHNEAKNGAR_DOMAIN = "cieee.xyz"
NEXT_PUBLIC_PHNEAKNGAR_ENVIRONMENT = "production"
