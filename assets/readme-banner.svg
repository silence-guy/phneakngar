<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-label="ភ្នាក់ងារ — your personal AI company, always on">
  <!-- Geist monochrome banner: black canvas, faint dot grid, gray-1000 mark + wordmark -->
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1600" height="500" fill="#000000"/>
  <rect width="1600" height="500" fill="url(#dots)"/>
  <rect x="1" y="1" width="1598" height="498" fill="none" stroke="#ffffff" stroke-opacity="0.145"/>

  <!-- Brand mark: app tile + agent figure + live signal -->
