  </g>

  <text x="800" y="290" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="92" font-weight="700" letter-spacing="-3.5" fill="#ededed">ភ្នាក់ងារ</text>
  <text x="800" y="352" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" letter-spacing="6" fill="#8f8f8f">YOUR PERSONAL AI COMPANY · ALWAYS ON</text>
