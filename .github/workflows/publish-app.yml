name: Publish App

on:
  push:
    branches: [main]
    paths: [src/app/package.json]

concurrency:
  group: publish-app
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @phneakngar/app to npm
    if: "${{ startsWith(github.event.head_commit.message, 'release: v') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PHNEAKNGAR_DOMAIN: phneakngar.invalid
      NEXT_PUBLIC_PHNEAKNGAR_DOMAIN: phneakngar.invalid
      NEXT_PUBLIC_PHNEAKNGAR_ENVIRONMENT: development
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Validate release version
        id: version
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(node -p "require('./src/app/package.json').version")
          RELEASE_VERSION=$(printf '%s' "$COMMIT_MSG" | sed -nE 's/^release: v([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?).*/\1/p')
          if [ -z "$RELEASE_VERSION" ] || [ "$VERSION" != "$RELEASE_VERSION" ]; then
            echo "App version $VERSION does not match release commit version ${RELEASE_VERSION:-missing}" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version already published
        id: check
        run: |
          if npm view "@phneakngar/app@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@phneakngar/app@${{ steps.version.outputs.version }} already on npm — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.check.outputs.skip == 'false'

      - uses: oven-sh/setup-bun@v2
        if: steps.check.outputs.skip == 'false'
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v6
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Upgrade npm for Trusted Publishers
        if: steps.check.outputs.skip == 'false'
        run: |
          npm install -g --prefix="$RUNNER_TEMP/npm-new" npm@12.0.0
          echo "$RUNNER_TEMP/npm-new/bin" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.skip == 'false'

      - name: Verify app package
        if: steps.check.outputs.skip == 'false'
        run: node scripts/verify-app-package.mjs

      - name: Publish to npm (OIDC)
        if: steps.check.outputs.skip == 'false'
        working-directory: src/app
        run: npm publish --access public
