name: Publish App

on:
  push:
    branches: [main]
    paths: [src/app/package.json]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing package version to publish"
        required: true
        type: string

concurrency:
  group: publish-app
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @phneakngar/app to npm
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: v') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PHNEAKNGAR_DOMAIN: phneakngar.invalid
      NEXT_PUBLIC_PHNEAKNGAR_DOMAIN: phneakngar.invalid
      NEXT_PUBLIC_PHNEAKNGAR_ENVIRONMENT: development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Validate release version
        id: version
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          DISPATCH_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          VERSION=$(node -p "require('./src/app/package.json').version")
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_VERSION="$DISPATCH_VERSION"
          else
            RELEASE_VERSION=$(printf '%s' "$COMMIT_MSG" | sed -nE 's/^release: v([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?).*/\1/p')
          fi
          if [ -z "$RELEASE_VERSION" ] || [ "$VERSION" != "$RELEASE_VERSION" ]; then
            echo "App version $VERSION does not match release commit version ${RELEASE_VERSION:-missing}" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version already published
        id: check
        run: |
          if npm view "@phneakngar/app@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@phneakngar/app@${{ steps.version.outputs.version }} already on npm — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.check.outputs.skip == 'false'

      - uses: oven-sh/setup-bun@v2
        if: steps.check.outputs.skip == 'false'
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v6
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.skip == 'false'

      - name: Verify app package
        if: steps.check.outputs.skip == 'false'
        run: node scripts/verify-app-package.mjs

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        working-directory: src/app
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          : "${NODE_AUTH_TOKEN:?NPM_TOKEN GitHub secret is required for npm publish}"
          npm publish --access public --tag latest
